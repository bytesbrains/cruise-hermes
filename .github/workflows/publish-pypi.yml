# Publish to PyPI on a version tag (v0.1.0, …).
#
# One-time setup (PyPI Trusted Publisher):
#   https://docs.pypi.org/trusted-publishers/
#   Project: bytesbrains-cruise-hermes
#   Owner: bytesbrains  Repo: cruise-hermes  Workflow: publish-pypi.yml  Environment: pypi
#
# Tag must match [project].version in pyproject.toml (with a leading v).

name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$TAG" = "$PY"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
